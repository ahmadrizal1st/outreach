<div id="message-preview" class="space-y-4">
  <div class="flex justify-between items-center border-b border-gray-100 pb-2">
    <h3 class="font-semibold text-gray-800 text-sm flex items-center gap-2">
      <span><i class="fa-brands fa-whatsapp"></i></span> Pilih Variasi Pesan
    </h3>
    <button
      hx-post="/messages/regenerate/{{ prospect_id }}"
      hx-target="#message-preview"
      hx-swap="outerHTML"
      class="text-xs text-indigo-600 hover:text-indigo-800 font-medium bg-indigo-50 px-2 py-1 rounded-md transition-colors"
      onclick="this.innerHTML='Menggenerate...'">
      <i class="fa-solid fa-rotate-right"></i> Generate Ulang
    </button>
  </div>

  {% if result.error %}
    <div class="bg-red-50 text-red-600 p-3 rounded-lg text-sm">
      {{ result.error }}
    </div>
  {% else %}
    {% for variant in result.variants %}
    <div class="border border-gray-200 rounded-xl p-4 hover:border-indigo-300 hover:shadow-sm transition-all bg-white relative group">
      
      <span class="text-[10px] uppercase tracking-wider font-semibold px-2 py-0.5 rounded-full mb-3 inline-block
        {% if variant.tone == 'formal' %}
          bg-blue-50 text-blue-600 border border-blue-100
        {% elif variant.tone == 'semi-formal' %}
          bg-purple-50 text-purple-600 border border-purple-100
        {% else %}
          bg-green-50 text-green-600 border border-green-100
        {% endif %}">
        {{ variant.tone }}
      </span>

      <p class="text-sm text-gray-700 leading-relaxed whitespace-pre-wrap mb-4">{{ variant.content }}</p>

      <p class="text-xs text-gray-400 absolute top-4 right-4">
        {{ variant.content | length }} char
      </p>

      <a href="{{ generator.generate_wa_link(result.prospect.phone_normalized, variant.content) }}"
         target="_blank"
         hx-post="/messages/sent/{{ variant.id }}"
         hx-swap="none"
         class="block w-full bg-[#25D366] hover:bg-[#128C7E] text-white font-medium text-sm py-2 rounded-lg text-center transition-colors shadow-sm"
         onclick="setTimeout(() => htmx.ajax('GET', '/messages/history/{{ prospect_id }}', {target: '#message-history'}), 1000)">
        <span class="flex items-center justify-center gap-2">
          <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.8 12.8 0 0 0-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413Z"/></svg>
          Kirim via WhatsApp
        </span>
      </a>
    </div>
    {% endfor %}
  {% endif %}
</div>

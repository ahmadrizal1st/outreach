<div id="preview-{{ prospect_id }}" class="bg-white rounded-xl p-4 shadow-sm border border-gray-100">

  {% if result.status == 'success' %}
  
  <div class="flex justify-between items-start mb-4">
    <div>
      <p class="font-semibold text-gray-900 text-sm">
        🎨 Preview Siap
      </p>
      <p class="text-xs text-gray-500 mt-1">
        Template: <span class="font-medium text-gray-700">{{ result.template | capitalize }}</span>
      </p>
    </div>
    <span class="bg-green-100 text-green-700 text-xs font-semibold px-2.5 py-1 rounded-full border border-green-200">
      ✅ Active
    </span>
  </div>
  
  <div class="flex gap-2">
  
    <!-- Buka Preview -->
    <button
      onclick="openPreview({{ prospect_id }})"
      class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-sm py-2.5 rounded-lg transition-colors shadow-sm">
      🖥️ Buka Preview
    </button>
  
    <!-- Regenerate -->
    <button
      hx-post="/api/preview/regenerate/{{ prospect_id }}"
      hx-target="#preview-{{ prospect_id }}"
      hx-swap="outerHTML"
      title="Generate Ulang"
      class="border border-gray-200 hover:bg-gray-50 text-gray-600 text-sm py-2.5 px-3.5 rounded-lg transition-colors">
      🔄
    </button>
  
  </div>
  
  {% elif result.status == 'error' %}
  
  <div class="text-red-500 text-sm mb-3">
    ❌ Gagal: {{ result.message }}
  </div>
  
  <button
    hx-post="/api/preview/generate/{{ prospect_id }}"
    hx-target="#preview-{{ prospect_id }}"
    hx-swap="outerHTML"
    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-sm py-2.5 rounded-lg transition-colors shadow-sm">
    ✨ Coba Generate Ulang
  </button>
  
  {% else %}
  
  <button
    hx-post="/api/preview/generate/{{ prospect_id }}"
    hx-target="#preview-{{ prospect_id }}"
    hx-swap="outerHTML"
    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-sm py-2.5 rounded-lg transition-colors shadow-sm flex items-center justify-center gap-2"
    onclick="this.innerHTML='<span class=\'animate-pulse\'>⏳ Sedang Membuat Preview...</span>'">
    ✨ Generate Preview Website
  </button>
  
  {% endif %}
  
  </div>
  
  {% if result.status == 'success' %}
  <script>
  function openPreview(prospectId) {
    fetch(`/api/preview/open/${prospectId}`)
      .then(r => r.json())
      .then(data => {
        if (data.url) {
          window.open(data.url, '_blank');
        } else {
          alert("Gagal membuka file preview.");
        }
      })
      .catch(err => {
        console.error(err);
        alert("Terjadi kesalahan saat membuka preview.");
      });
  }
  </script>
  {% endif %}

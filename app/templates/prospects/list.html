{% extends 'base.html' %}
{% block content %}

<div class="mb-6 flex items-center justify-between">
  <div>
    <h1 class="text-2xl font-bold text-gray-900"><i class="fa-solid fa-users text-indigo-600"></i> Daftar Prospect</h1>
    <p class="text-sm text-gray-500 mt-1">Kelola calon client, filter berdasarkan tier atau status, dan tambahkan manual.</p>
  </div>
  <a href="/prospects/new" class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium px-4 py-2 rounded-lg transition-colors shadow-sm flex items-center gap-2">
    <i class="fa-solid fa-plus"></i> Tambah Manual
  </a>
</div>

<div class="bg-white rounded-xl p-4 shadow-sm border border-gray-100 mb-6">
  <form hx-get="/prospects/filter" hx-target="#prospect-list" hx-trigger="change, keyup delay:500ms from:input[name='search']" class="flex flex-col md:flex-row gap-4 items-center">
    
    <div class="w-full md:w-auto flex gap-3 flex-wrap flex-1">
      
      <select name="tier" class="border border-gray-300 rounded-lg px-3 py-2 text-sm text-gray-700 bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
        <option value="">Semua Tier</option>
        <option value="HOT">🔥 HOT</option>
        <option value="WARM">⚡ WARM</option>
        <option value="COLD">❄️ COLD</option>
      </select>

      <select name="category" class="border border-gray-300 rounded-lg px-3 py-2 text-sm text-gray-700 bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
        <option value="">Semua Kategori</option>
        {% for cat in categories %}
        <option value="{{ cat }}">{{ cat }}</option>
        {% endfor %}
      </select>

      <select name="status" class="border border-gray-300 rounded-lg px-3 py-2 text-sm text-gray-700 bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
        <option value="">Semua Status</option>
        <option value="raw">Raw (Baru)</option>
        <option value="scored">Scored</option>
        <option value="belum_dihubungi">Belum Dihubungi</option>
        <option value="sudah_dihubungi">Sudah Dihubungi</option>
        <option value="dibalas">Dibalas</option>
        <option value="deal">Deal ✅</option>
      </select>
    </div>

    <div class="w-full md:w-64">
      <input type="text" name="search" placeholder="Cari nama bisnis..." class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm text-gray-700 focus:outline-none focus:ring-2 focus:ring-indigo-500">
    </div>
  </form>
</div>

<div id="prospect-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
  {% include 'prospects/list_partial.html' %}
</div>

{% endblock %}
